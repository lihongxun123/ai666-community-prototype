services:
  research:
    image: node:22-bookworm-slim@sha256:43ac6c60b8f89723f746e8a92ce91abd5017e627ce1ddfe4238355d3a30b772c
    container_name: research-room
    working_dir: /app
    user: "1000:1000"
    command: ["node", "server.js"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - "${RESEARCH_RELEASE:?Set RESEARCH_RELEASE}:/app:ro"
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
